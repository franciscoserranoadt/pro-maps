name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Comprobar contraseña de firma
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Falta el secreto KEYSTORE_PASS (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ProMaps.apk
          VC=$(grep -oP "versionCode \K\d+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "$VC $VN" > version.txt
          cat version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ProMaps
          path: ProMaps.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ProMaps.apk version.txt --title "Pro Maps (última versión)" --notes "APK para instalar en el móvil y en la pantalla del coche."
