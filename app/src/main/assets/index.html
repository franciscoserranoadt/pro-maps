<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pro Maps</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>

<!-- Pantalla de carga / error -->
<div id="splash"><div class="logo">▲</div><div class="brand">Pro Maps</div><div id="splashMsg">Cargando mapa…</div></div>

<!-- Barra de búsqueda (modo libre) -->
<div id="searchBar" class="card">
  <span class="ico">🔍</span>
  <input id="q" type="search" placeholder="¿A dónde vamos?" autocomplete="off">
  <button id="btnSettings" class="iconbtn" title="Ajustes">⚙️</button>
</div>

<!-- Accesos rápidos -->
<div id="quick">
  <button class="qchip" id="qCasa">🏠 Casa</button>
  <button class="qchip" id="qTrabajo">💼 Trabajo</button>
  <button class="qchip" id="qFav">⭐ Favoritos</button>
  <button class="qchip hidden" id="qPark">🅿️ Mi coche</button>
  <button class="qchip" id="qGas">⛽ Gasolineras</button>
  <button class="qchip" id="qStats">📊 Viajes</button>
</div>

<div id="side">
<!-- Indicación de la próxima maniobra (navegando) -->
<div id="banner" class="hidden">
  <div id="bArrow">⬆</div>
  <div class="bText">
    <div id="bDist">—</div>
    <div id="bStreet">—</div>
  </div>
  <div id="bThen" class="hidden"></div>
</div>

<!-- Carriles -->
<div id="lanes" class="hidden"></div>

<!-- Aviso de radar / incidencia -->
<div id="alert" class="hidden">
  <div id="aIcon">📷</div>
  <div class="aText"><div id="aTitle">Radar</div><div id="aSub"></div></div>
  <div id="aDist">500 m</div>
  <div id="aLimit" class="hidden">100</div>
</div>

<!-- Tramo de velocidad controlada -->
<div id="tramo" class="hidden">
  <div class="tRow"><div class="tIco">⏱️</div><div class="tTxt"><div id="tTitle">Tramo controlado</div><div id="tSub">quedan 3 km</div></div>
    <div class="tAvg"><div id="tAvg">0</div><div class="tU">media km/h</div></div><div id="tLim" class="tLim">100</div></div>
  <div class="tBar"><div id="tFill"></div></div>
</div>

<!-- Aviso genérico (retraso, aparcamiento…) -->
<div id="notice" class="hidden">
  <div class="apTop"><div class="apIco" id="nIco">⏱️</div><div class="apTxt"><div id="nTitle"></div><div id="nSub"></div></div></div>
  <div class="apBtns"><button id="nNo" class="btn alt">Cerrar</button><button id="nYes" class="btn">Avisar</button></div>
</div>
<button id="parkPill" class="hidden">🅿️ <span id="parkN">0</span></button>
<!-- Propuesta de ruta más rápida -->
<div id="altPrompt" class="hidden">
  <div class="apTop"><div class="apIco">↪️</div><div class="apTxt"><div id="apTitle">Ruta 6 min más rápida</div><div id="apSub"></div></div></div>
  <div class="apBtns"><button id="apNo" class="btn alt">No, gracias</button><button id="apYes" class="btn">Cambiar</button></div>
  <div class="apBar"><div id="apFill"></div></div>
</div>

<!-- Barra de la ruta con incidencias -->
<div id="routeBar" class="hidden"></div>

<!-- Barra inferior navegando -->
<div id="navBar" class="hidden">
  <button id="btnStop" class="round red">✕</button>
  <div class="navInfo">
    <div id="nEta">--:--</div>
    <div id="nRest">-- min · -- km</div>
  </div>
  <button id="btnRoutes" class="round" title="Vista general">🧭</button>
</div>

</div>

<!-- Velocímetro -->
<div id="speed"><div id="spdVal">0</div><div class="spdU">km/h</div></div>
<div id="limit" class="hidden">50</div>
<div id="wx" class="hidden"></div>

<!-- Botones laterales -->
<div id="fabs">
  <button id="btnMic" class="fab" title="Órdenes por voz">🎤</button>
  <button id="btnSet2" class="fab hidden" title="Ajustes">⚙️</button>
  <button id="btnGas" class="fab hidden" title="Gasolineras">⛽</button>
  <button id="btnTraffic" class="fab" title="Tráfico">🚦</button>
  <button id="btnLayers" class="fab" title="Capas">🗺️</button>
  <button id="btnReport" class="fab warn" title="Avisar">⚠️</button>
</div>
<button id="btnRecenter" class="pill hidden">◎ Recentrar</button>

<!-- Hoja inferior genérica -->
<div id="sheetBg" class="hidden"></div>
<div id="sheet" class="hidden"><div class="grab"></div><div id="sheetBody"></div></div>

<div id="toast" class="hidden"></div>
<div id="voiceBox" class="hidden"><div class="vbIco">🎤</div><div id="vbTxt">Te escucho…</div></div>

<script src="app.js"></script>
</body>
</html>
