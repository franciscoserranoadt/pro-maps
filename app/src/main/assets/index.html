<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pro Maps</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>

<!-- Pantalla de carga / error -->
<div id="splash"><div class="logo">▲</div><div class="brand">Pro Maps</div><div id="splashMsg">Cargando mapa…</div></div>

<!-- Barra superior: buscador en píldora con micrófono, y ajustes -->
<div id="topBar">
  <div id="searchBar">
    <span class="ico" data-ic="search"></span>
    <input id="q" type="search" placeholder="¿A dónde vamos?" autocomplete="off">
    <button id="btnMic" class="micBtn" title="Órdenes por voz" data-ic="mic"></button>
  </div>
  <button id="btnSettings" class="circ" title="Ajustes" data-ic="gear"></button>
</div>

<!-- Panel inferior (sin ruta): Casa, Trabajo, favoritos y accesos -->
<div id="home">
  <div class="grab"></div>
  <div id="homeCards">
    <button class="hCard" id="qCasa"><span class="hIco home" data-ic="home"></span><span class="hTxt"><b>Casa</b><small id="hCasa">Añadir</small></span></button>
    <button class="hCard" id="qTrabajo"><span class="hIco work" data-ic="work"></span><span class="hTxt"><b>Trabajo</b><small id="hTrabajo">Añadir</small></span></button>
    <span id="hFavs"></span>
    <button class="hCard add" id="qFav" title="Favoritos"><span class="hIco plus" data-ic="star"></span></button>
  </div>
  <div id="homeCats">
    <button class="cat" id="qGas" title="Gasolineras"><span data-ic="fuel" class="c-red"></span></button>
    <button class="cat" id="qFood" title="Restaurantes"><span data-ic="food" class="c-amber"></span></button>
    <button class="cat" id="qParkNear" title="Aparcamientos"><span class="pTxt">P</span></button>
    <button class="cat hidden" id="qPark" title="Mi coche"><span data-ic="car" class="c-blue"></span></button>
    <button class="cat" id="qStats" title="Mis viajes"><span data-ic="chart" class="c-green"></span></button>
  </div>
</div>

<div id="side">
<!-- Indicación de la próxima maniobra (navegando) -->
<div id="banner" class="hidden">
  <div id="bArrow">⬆</div>
  <div class="bText">
    <div id="bDist">—</div>
    <div id="bStreet">—</div>
  </div>
  <div id="bThen" class="hidden"></div>
</div>

<!-- Carriles -->
<div id="lanes" class="hidden"></div>

<!-- Aviso de radar / incidencia -->
<div id="alert" class="hidden">
  <div id="aIcon">📷</div>
  <div class="aText"><div id="aTitle">Radar</div><div id="aSub"></div></div>
  <div id="aDist">500 m</div>
  <div id="aLimit" class="hidden">100</div>
</div>

<!-- Tramo de velocidad controlada -->
<div id="tramo" class="hidden">
  <div class="tRow"><div class="tIco">⏱️</div><div class="tTxt"><div id="tTitle">Tramo controlado</div><div id="tSub">quedan 3 km</div></div>
    <div class="tAvg"><div id="tAvg">0</div><div class="tU">media km/h</div></div><div id="tLim" class="tLim">100</div></div>
  <div class="tBar"><div id="tFill"></div></div>
</div>

<!-- Aviso genérico (retraso, aparcamiento…) -->
<div id="notice" class="hidden">
  <div class="apTop"><div class="apIco" id="nIco">⏱️</div><div class="apTxt"><div id="nTitle"></div><div id="nSub"></div></div></div>
  <div class="apBtns"><button id="nNo" class="btn alt">Cerrar</button><button id="nYes" class="btn">Avisar</button></div>
</div>
<button id="parkPill" class="hidden">🅿️ <span id="parkN">0</span></button>
<!-- Propuesta de ruta más rápida -->
<div id="altPrompt" class="hidden">
  <div class="apTop"><div class="apIco">↪️</div><div class="apTxt"><div id="apTitle">Ruta 6 min más rápida</div><div id="apSub"></div></div></div>
  <div class="apBtns"><button id="apNo" class="btn alt">No, gracias</button><button id="apYes" class="btn">Cambiar</button></div>
  <div class="apBar"><div id="apFill"></div></div>
</div>

<!-- Barra de la ruta con incidencias -->
<div id="routeBar" class="hidden"></div>

<!-- Barra inferior navegando -->
<div id="navBar" class="hidden">
  <button id="btnStop" class="round red">✕</button>
  <div class="navInfo">
    <div id="nEta">--:--</div>
    <div id="nRest">-- min · -- km</div>
  </div>
  <button id="btnRoutes" class="round" title="Vista general">🧭</button>
</div>

</div>

<!-- Velocímetro -->
<div id="speed"><svg viewBox="0 0 100 100"><path class="trk" d="M22 78 A38 38 0 1 1 78 78"/><path id="spdArc" class="arc" d="M22 78 A38 38 0 1 1 78 78"/></svg><div id="spdVal">0</div><div class="spdU">km/h</div></div>
<div id="limit" class="hidden">50</div>
<div id="wx" class="hidden"></div>

<!-- Botones de la derecha en «píldoras» -->
<div id="rail">
  <button id="btnMedia" class="circ media hidden" title="Música" data-ic="music"></button>
  <div class="grp">
    <button id="btnNorth" title="Norte arriba"><span id="north"><i></i>N</span></button>
    <button id="btnSound" title="Sonido" data-ic="vol"></button>
    <button id="btnMicNav" class="navOnly" title="Órdenes por voz" data-ic="mic"></button>
    <button id="btnReport" class="flag" title="Avisar" data-ic="flag"></button>
    <button id="btnAlts" class="navOnly" title="Rutas alternativas" data-ic="fork"></button>
    <button id="btnLayers" title="Opciones del mapa" data-ic="layers"></button>
    <button id="btnSetNav" class="navOnly" title="Ajustes" data-ic="gear"></button>
  </div>
  <div class="grp">
    <button id="btnZoomIn" title="Acercar" data-ic="plus"></button>
    <button id="btnZoomOut" title="Alejar" data-ic="minus"></button>
  </div>
</div>
<!-- (botones antiguos que usa el código; no se ven) -->
<div id="legacy">
  <button id="btnMore"></button><div id="fabMore"></div>
  <button id="btnSet2"></button><button id="btnGas"></button><button id="btnStyle"></button><button id="btnTraffic"></button>
</div>
<div id="reportPop" class="hidden"></div>
<button id="btnRecenter" class="pill hidden"><span data-ic="target"></span> Centrar</button>

<!-- Hoja inferior genérica -->
<div id="sheetBg" class="hidden"></div>
<div id="sheet" class="hidden"><div class="grab"></div><button id="sheetX" class="circ sm" data-ic="close" title="Cerrar"></button><div id="sheetBody"></div></div>

<div id="toast" class="hidden"></div>
<div id="mediaCard" class="hidden">
  <div class="mcTop"><img id="mcArt" alt=""><div class="mcTxt"><div id="mcTitle">—</div><div id="mcArtist"></div><div id="mcApp"></div></div></div>
  <div class="mcBtns"><button data-mc="prev">⏮</button><button data-mc="toggle" id="mcPlay">⏯</button><button data-mc="next">⏭</button></div>
</div>
<div id="camView" class="hidden"><video id="camVideo" autoplay playsinline muted></video>
  <div id="camInfo"></div><button id="camClose" class="round red">✕</button></div>
<div id="voiceBox" class="hidden"><div class="vbIco">🎤</div><div id="vbTxt">Te escucho…</div></div>

<script src="prosync.js"></script>
<script src="app.js"></script>
</body>
</html>
