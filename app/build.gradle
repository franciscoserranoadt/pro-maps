plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fserrano.promaps'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fserrano.promaps'
        minSdk 23
        targetSdk 34
        versionCode 45
        versionName '3.23'
    }

    signingConfigs {
        fija {
            // Firma fija: así cada versión se instala encima de la anterior
            storeFile rootProject.file('promaps.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'pirunav'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_PASS')) signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PASS')) signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.car.app:app:1.4.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
